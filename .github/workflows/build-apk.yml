name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and bundle web app
        run: |
          npm ci
          node build.mjs
          npx cap sync android

      # The signing key lives only in GitHub Actions secrets, never in the repository.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.JADWAL_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Signing secrets are not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jadwal.keystore"
          echo "JADWAL_KEYSTORE_FILE=$RUNNER_TEMP/jadwal.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          JADWAL_KEYSTORE_PASSWORD: ${{ secrets.JADWAL_KEYSTORE_PASSWORD }}
          JADWAL_KEY_ALIAS: ${{ secrets.JADWAL_KEY_ALIAS }}
          JADWAL_KEY_PASSWORD: ${{ secrets.JADWAL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jadwal.keystore"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Jadwal-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jadwal-apk
          path: Jadwal-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jadwal 1.0.${{ github.run_number }}
          body: |
            Install **Jadwal-${{ github.run_number }}.apk** on your Android phone. Each release installs over the previous one and keeps your data.
            ثبّت الملف **Jadwal-${{ github.run_number }}.apk** على هاتفك. كل إصدار يُثبَّت فوق السابق ويحتفظ ببياناتك.
          files: Jadwal-${{ github.run_number }}.apk
          make_latest: true
